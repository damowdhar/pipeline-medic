<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrowOracle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f9d58"/>
    </marker>
  </defs>

  <rect width="1240" height="720" fill="#ffffff"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#202124">Pipeline Medic</text>
  <text x="40" y="80" font-size="15.5" fill="#5f6368">Autonomous data-pipeline triage — diagnoses the failure, writes the fix, and proves it works before proposing it.</text>
  <line x1="40" y1="98" x2="1200" y2="98" stroke="#e8eaed" stroke-width="1.5"/>

  <!-- ============ TRIGGER COLUMN ============ -->
  <text x="40" y="132" font-size="12.5" font-weight="700" fill="#80868b" letter-spacing="1.2">TRIGGER</text>

  <rect x="40" y="148" width="228" height="94" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="154" y="182" font-size="15.5" font-weight="600" fill="#202124" text-anchor="middle">Scheduler</text>
  <text x="154" y="204" font-size="13" fill="#5f6368" text-anchor="middle">Airflow / dbt / cron</text>
  <text x="154" y="224" font-size="12.5" fill="#d93025" text-anchor="middle">a model fails at 3am</text>

  <line x1="154" y1="242" x2="154" y2="292" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="164" y="272" font-size="12" fill="#5f6368">failure event</text>

  <rect x="40" y="292" width="228" height="90" rx="10" fill="#e6f4ea" stroke="#0f9d58" stroke-width="1.5"/>
  <text x="154" y="324" font-size="15.5" font-weight="600" fill="#0d652d" text-anchor="middle">Pub/Sub</text>
  <text x="154" y="345" font-size="12.5" fill="#137333" text-anchor="middle">pipeline-failures</text>
  <text x="154" y="365" font-size="12" fill="#137333" text-anchor="middle">push subscription</text>

  <path d="M 268 337 L 322 337" stroke="#5f6368" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="420" width="228" height="122" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="154" y="450" font-size="14.5" font-weight="700" fill="#b06000" text-anchor="middle">Asynchronous</text>
  <text x="154" y="474" font-size="12.5" fill="#7f5000" text-anchor="middle">The push endpoint acks</text>
  <text x="154" y="492" font-size="12.5" fill="#7f5000" text-anchor="middle">immediately, then triages</text>
  <text x="154" y="510" font-size="12.5" fill="#7f5000" text-anchor="middle">in the background — no</text>
  <text x="154" y="528" font-size="12.5" fill="#7f5000" text-anchor="middle">caller waits, no redelivery.</text>

  <!-- ============ CLOUD RUN ============ -->
  <text x="322" y="132" font-size="12.5" font-weight="700" fill="#80868b" letter-spacing="1.2">GOOGLE CLOUD RUN</text>

  <rect x="322" y="148" width="416" height="470" rx="12" fill="#f1f6fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="530" y="180" font-size="16.5" font-weight="700" fill="#1557b0" text-anchor="middle">pipeline-medic</text>
  <text x="530" y="201" font-size="12.5" fill="#5f6368" text-anchor="middle">FastAPI · us-central1 · scales to zero</text>

  <rect x="348" y="220" width="364" height="66" rx="8" fill="#ffffff" stroke="#c9ddf7" stroke-width="1.5"/>
  <text x="530" y="245" font-size="13.5" font-weight="600" fill="#202124" text-anchor="middle">/pubsub · /triage · /runs</text>
  <text x="530" y="266" font-size="12" fill="#5f6368" text-anchor="middle">ack fast · triage in background task</text>

  <rect x="348" y="302" width="364" height="292" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="530" y="330" font-size="15.5" font-weight="700" fill="#1557b0" text-anchor="middle">ADK LlmAgent</text>
  <text x="530" y="350" font-size="12" fill="#5f6368" text-anchor="middle">google-adk 2.7.1</text>

  <line x1="368" y1="364" x2="692" y2="364" stroke="#e8eaed" stroke-width="1.5"/>
  <text x="368" y="386" font-size="11.5" font-weight="700" fill="#80868b" letter-spacing="1">TOOLS</text>

  <text x="368" y="410" font-size="13" fill="#3c4043">read_model_sql</text>
  <text x="368" y="434" font-size="13" fill="#3c4043">list_tables · get_table_schema</text>
  <text x="368" y="458" font-size="13" fill="#3c4043">run_query</text>

  <rect x="360" y="472" width="344" height="52" rx="8" fill="#e6f4ea" stroke="#0f9d58" stroke-width="1.8"/>
  <text x="376" y="494" font-size="13.5" font-weight="700" fill="#0d652d">dry_run_sql</text>
  <text x="376" y="513" font-size="11.5" fill="#137333">the oracle — validates a fix before it is proposed</text>

  <text x="368" y="551" font-size="12" fill="#5f6368">loop: hypothesise → patch → validate → revise</text>
  <text x="368" y="573" font-size="12" fill="#5f6368">until BigQuery confirms, or report needs_human</text>

  <!-- ============ SERVICES COLUMN ============ -->
  <text x="792" y="132" font-size="12.5" font-weight="700" fill="#80868b" letter-spacing="1.2">GOOGLE CLOUD SERVICES</text>

  <!-- Vertex -->
  <rect x="792" y="148" width="408" height="112" rx="10" fill="#f3e8fd" stroke="#7b3fe4" stroke-width="1.8"/>
  <text x="816" y="180" font-size="16" font-weight="700" fill="#5b2bb0">Vertex AI</text>
  <text x="816" y="205" font-size="14" fill="#3c4043">gemini-3.7-flash</text>
  <text x="816" y="228" font-size="12.5" fill="#7f5000">location = global</text>
  <text x="816" y="248" font-size="11.5" fill="#5f6368">Gemini 3.x is not served from regional endpoints</text>

  <path d="M 738 300 C 764 300 766 210 790 206" stroke="#7b3fe4" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="748" y="286" font-size="11.5" fill="#5b2bb0">reason</text>

  <!-- BigQuery -->
  <rect x="792" y="292" width="408" height="130" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
  <text x="816" y="324" font-size="16" font-weight="700" fill="#1557b0">BigQuery</text>
  <text x="816" y="348" font-size="13" fill="#3c4043">medic_demo — the warehouse being repaired</text>
  <text x="816" y="372" font-size="13" fill="#0d652d" font-weight="600">…and the oracle that validates the repair</text>
  <text x="816" y="396" font-size="11.5" fill="#5f6368">dry run type-checks against live schemas, at no cost</text>

  <path d="M 704 498 C 750 498 756 372 790 360" stroke="#0f9d58" stroke-width="2.2" fill="none" marker-end="url(#arrowOracle)"/>
  <text x="716" y="440" font-size="11.5" font-weight="600" fill="#0d652d">validate</text>

  <!-- Firestore -->
  <rect x="792" y="454" width="408" height="164" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8"/>
  <text x="816" y="486" font-size="16" font-weight="700" fill="#b06000">Firestore</text>
  <text x="816" y="510" font-size="13" fill="#3c4043">triage_runs — every verdict, with reasoning</text>
  <text x="816" y="534" font-size="13" fill="#3c4043">database: hackathon (not "(default)")</text>
  <line x1="816" y1="550" x2="1176" y2="550" stroke="#f4d290" stroke-width="1.5"/>
  <text x="816" y="574" font-size="12.5" font-weight="600" fill="#b06000">Memory</text>
  <text x="816" y="596" font-size="11.5" fill="#5f6368">prior confirmed fixes for a model are fed back as</text>
  <text x="816" y="612" font-size="11.5" fill="#5f6368">context, so repeat breakages resolve faster</text>

  <path d="M 738 540 C 758 540 766 524 790 520" stroke="#f9ab00" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="742" y="528" font-size="11.5" fill="#b06000">record</text>

  <!-- footer -->
  <line x1="40" y1="654" x2="1200" y2="654" stroke="#e8eaed" stroke-width="1.5"/>
  <text x="40" y="682" font-size="12.5" fill="#5f6368">Gemini 3.7 Flash · Google ADK · Cloud Run · Pub/Sub · Firestore · BigQuery</text>
  <text x="1200" y="682" font-size="12.5" fill="#80868b" text-anchor="end">github.com/damowdhar/pipeline-medic</text>
</svg>
